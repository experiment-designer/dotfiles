Section "InputClass"
	Identifier "Logitech G305 pointer speed"
	MatchProduct "G305"
	MatchIsPointer "on"
	MatchDriver "libinput"
	Option "AccelSpeed" "-0.5"
	# ponytail: linear scale of all motion; lower hardware DPI via libratbag if this feels steppy
	Option "TransformationMatrix" "0.5 0 0 0 0.5 0 0 0 1"
EndSection
