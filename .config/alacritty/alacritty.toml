# Phosphor palette — see ~/dotfiles/palette.md

[colors.primary]
background = "#16181d"
foreground = "#e6e9ed"

[colors.cursor]
cursor = "#ffb340"
text = "#16181d"

[colors.vi_mode_cursor]
cursor = "#5ed3f3"
text = "#16181d"

[colors.selection]
background = "#2c313a"
text = "CellForeground"

[colors.search.matches]
background = "#ffd866"
foreground = "#16181d"

[colors.search.focused_match]
background = "#ffb340"
foreground = "#16181d"

[colors.footer_bar]
background = "#1c1f25"
foreground = "#b7bec8"

[colors.hints.start]
background = "#ffb340"
foreground = "#16181d"

[colors.hints.end]
background = "#2c313a"
foreground = "#ffb340"

[colors.normal]
black = "#23272e"
red = "#ff4d6d"
green = "#98c379"
yellow = "#ffb340"
blue = "#5b9dff"
magenta = "#d67cff"
cyan = "#5ed3f3"
white = "#dfe3e8"

[colors.bright]
black = "#7b838f"
red = "#ff7a90"
green = "#b3d98f"
yellow = "#ffc966"
blue = "#82b6ff"
magenta = "#e3a0ff"
cyan = "#8ee3fa"
white = "#f4f6f8"

[cursor]
blink_interval = 0

[cursor.style]
shape = "Block"
blinking = "Never"

[font]
size = 11.0
builtin_box_drawing = true

[font.normal]
family = "InputMono Nerd Font"
style = "Regular"

[font.bold]
family = "InputMono Nerd Font"
style = "Bold"

[font.italic]
family = "InputMono Nerd Font"
style = "Italic"

[selection]
save_to_clipboard = true

[window]
decorations = "none"
opacity = 1.0
dynamic_padding = false

[window.padding]
x = 10
y = 8

[keyboard]

[bell]
duration = 0
command = { program = "/home/guy/dotfiles/bin/blip", args = ["bell"] }
