<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 76 80 H 84 M 80 76 V 84" stroke="#3a404a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="#16181d"/>

  <!-- Sparse grid of tiny plus-signs -->
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Hairline near-white corner brackets and tick marks -->
  <g fill="none" stroke="#e6e9ed" stroke-width="1" stroke-opacity="0.35">
    <!-- Top-left bracket -->
    <path d="M 320 280 V 240 H 360"/>
    <!-- Top-right bracket -->
    <path d="M 3480 240 H 3520 V 280"/>
    <!-- Bottom-left bracket -->
    <path d="M 320 1880 V 1920 H 360"/>
    <!-- Upper-right of center bracket -->
    <path d="M 2520 1280 H 2560 V 1320"/>

    <!-- Hairline tick marks -->
    <path d="M 1280 232 V 248 M 1272 240 H 1288"/>
    <path d="M 640 1072 V 1088 M 632 1080 H 648"/>
    <path d="M 2640 1330 V 1360"/>
    <path d="M 2610 1360 H 2640"/>
  </g>

  <!-- Bold angular element: huge lime outlined rectangle offset to lower-right -->
  <rect x="2560" y="1440" width="1920" height="1080" fill="none" stroke="#ffb340" stroke-width="3"/>
</svg>
